name: stage game refs
description: >
  Pull a RimWorld game image and lay its managed assemblies out on disk, with Version.txt beside
  them, the same layout gamecrate's local refs dir has. The calling job needs "packages: read"
  and a GITHUB_TOKEN; an action cannot grant either.

inputs:
  image:
    description: Game image to stage from, as produced by game-image.yml
    required: true
  token:
    description: Token that can read packages from ghcr.io
    default: ${{ github.token }}
  dest:
    description: Directory the game files are copied into
    default: ''

outputs:
  managed-dir:
    description: The staged Managed directory, which also holds Version.txt
    value: ${{ steps.stage.outputs.managed-dir }}
  version:
    description: Major.minor read out of the image's own Version.txt
    value: ${{ steps.stage.outputs.version }}

runs:
  using: composite
  steps:
    - name: Stage the game assemblies
      id: stage
      shell: bash
      env:
        GAME_IMAGE: ${{ inputs.image }}
        REGISTRY_TOKEN: ${{ inputs.token }}
        DEST: ${{ inputs.dest != '' && inputs.dest || format('{0}/game', runner.temp) }}
      run: |
        set -euo pipefail
        echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
        docker pull -q "$GAME_IMAGE"
        cid="$(docker create "$GAME_IMAGE")"
        trap 'docker rm -f "$cid" >/dev/null' EXIT

        managed="$DEST/RimWorldLinux_Data/Managed"
        mkdir -p "$managed"
        src="$(docker run --rm --entrypoint sh "$GAME_IMAGE" -c \
          'find /game -name Assembly-CSharp.dll 2>/dev/null |
             awk "{ print gsub(/\//, \"/\"), \$0 }" | sort -n | head -1 | cut -d" " -f2-')"
        [[ -n "$src" ]] || {
          echo "::error::$GAME_IMAGE has no Assembly-CSharp.dll anywhere under /game"
          exit 1
        }
        echo "assemblies live at $(dirname "$src")"
        docker run --rm --entrypoint sh "$GAME_IMAGE" \
          -c "cd '$(dirname "$src")' && tar -c ./*.dll" | tar -x -C "$managed"
        docker cp "$cid:/game/Version.txt" "$managed/Version.txt"
        echo "managed-dir=$managed" >> "$GITHUB_OUTPUT"

        # the image knows its own version, so a caller cannot map the wrong one
        version="$(sed -n 's/^\([0-9]*\.[0-9]*\).*/\1/p' "$managed/Version.txt" | head -1)"
        [[ -n "$version" ]] || { echo "::error::no version in $managed/Version.txt"; exit 1; }
        echo "version=$version" >> "$GITHUB_OUTPUT"
        echo "GAME_MANAGED_${version//./_}=$managed" >> "$GITHUB_ENV"

        echo "staged $(ls "$managed"/*.dll | wc -l) assemblies for $(cat "$managed/Version.txt")"
