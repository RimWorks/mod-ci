name: dotnet sonar
description: Build, gate on analyzers, test and cover a RimWorks mod inside a SonarCloud scan.

inputs:
  solution:
    description: Solution or project to build and test
    required: true
  project-key:
    description: SonarCloud project key
    required: true
  sonar-token:
    description: SonarCloud token
    required: true
  organization:
    description: SonarCloud organization
    default: rimworks
  dotnet-version:
    description: SDK to install
    default: 10.0.x
  configuration:
    description: Build configuration
    default: Release
  exclusions:
    description: Value for sonar.exclusions
    default: ''
  coverage-exclusions:
    description: Value for sonar.coverage.exclusions
    default: ''
  extra-begin-args:
    description: "Extra /d: args appended to scanner begin, for example a javascript lcov path"
    default: ''
  analyzer-severity:
    description: Severity for the analyzer gate, or 'none' to skip it
    default: info
  test-filter:
    description: dotnet test --filter, to keep timing-sensitive tests out of an instrumented run
    default: ''

runs:
  using: composite
  steps:
    - name: Setup JDK
      uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
      with:
        java-version: 17
        distribution: zulu

    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: ${{ inputs.dotnet-version }}

    - name: Cache Sonar packages
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.sonar/cache
        key: ${{ runner.os }}-sonar
        restore-keys: ${{ runner.os }}-sonar

    - name: Cache Sonar scanner
      id: cache-scanner
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/scanner
        key: ${{ runner.os }}-sonar-scanner
        restore-keys: ${{ runner.os }}-sonar-scanner

    - name: Install Sonar scanner
      if: steps.cache-scanner.outputs.cache-hit != 'true'
      shell: bash
      run: dotnet tool update dotnet-sonarscanner --tool-path "${{ runner.temp }}/scanner"

    - name: Begin analysis
      shell: bash
      env:
        SONAR_TOKEN: ${{ inputs.sonar-token }}
        PROJECT_KEY: ${{ inputs.project-key }}
        ORGANIZATION: ${{ inputs.organization }}
        EXCLUSIONS: ${{ inputs.exclusions }}
        COVERAGE_EXCLUSIONS: ${{ inputs.coverage-exclusions }}
        EXTRA_BEGIN_ARGS: ${{ inputs.extra-begin-args }}
        SCANNER: ${{ runner.temp }}/scanner/dotnet-sonarscanner
        # git bash rewrites a leading-slash argument into a windows path, which strips the
        # slash the scanner needs. only bites on windows runners.
        MSYS2_ARG_CONV_EXCL: "*"
      run: |
        # An empty /d: value is a hard error, so the optional ones are only added when set.
        args=(
          begin
          /k:"$PROJECT_KEY"
          /o:"$ORGANIZATION"
          /d:sonar.token="$SONAR_TOKEN"
          /d:sonar.host.url="https://sonarcloud.io"
          /d:sonar.cs.opencover.reportsPaths="artifacts/coverage/**/coverage.opencover.xml"
        )
        if [ -n "$EXCLUSIONS" ]; then
          args+=(/d:sonar.exclusions="$EXCLUSIONS")
        fi
        if [ -n "$COVERAGE_EXCLUSIONS" ]; then
          args+=(/d:sonar.coverage.exclusions="$COVERAGE_EXCLUSIONS")
        fi
        # set -f so the ** in a resourceKey is passed through instead of glob-expanded.
        set -f
        extra=($EXTRA_BEGIN_ARGS)
        set +f
        "$SCANNER" "${args[@]}" "${extra[@]}"

    - name: Build
      shell: bash
      run: dotnet build "${{ inputs.solution }}" -c "${{ inputs.configuration }}"

    # MSTEST and CA rules ship at info severity, which dotnet build never prints. Without this
    # they reach a human as a SonarCloud issue days later instead of as a red build.
    - name: Analyzer gate
      if: inputs.analyzer-severity != 'none'
      shell: bash
      run: |
        dotnet format analyzers "${{ inputs.solution }}" \
          --severity "${{ inputs.analyzer-severity }}" --verify-no-changes --no-restore

    # coverlet only records hits for a modern assembly, so the mod needs a net10.0 build
    # alongside the net472 one the game loads.
    - name: Test and collect coverage
      shell: bash
      env:
        TEST_FILTER: ${{ inputs.test-filter }}
      run: |
        filter=()
        if [ -n "$TEST_FILTER" ]; then
          filter=(--filter "$TEST_FILTER")
        fi
        dotnet test "${{ inputs.solution }}" -c "${{ inputs.configuration }}" --no-build \
          --collect:"XPlat Code Coverage;Format=opencover" \
          --results-directory artifacts/coverage "${filter[@]}"

    - name: End analysis
      shell: bash
      env:
        SONAR_TOKEN: ${{ inputs.sonar-token }}
        MSYS2_ARG_CONV_EXCL: "*"
      run: '"${{ runner.temp }}/scanner/dotnet-sonarscanner" end /d:sonar.token="$SONAR_TOKEN"'
