name: node build

on:
  workflow_call:
    inputs:
      working-directory:
        description: Directory holding package.json.
        type: string
        default: .
      node-version:
        description: Node major version to build with.
        type: string
        default: '22'
      lint:
        description: Run npm run lint before building.
        type: boolean
        default: false
      artifact-name:
        description: Name to upload the build output under.
        type: string
        required: true
      artifact-path:
        description: Build output, relative to working-directory.
        type: string
        default: dist

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json

      - name: Install
        run: npm ci --ignore-scripts

      - name: Lint
        if: inputs.lint
        run: npm run lint

      - name: Build
        run: npm run build

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ inputs.working-directory }}/${{ inputs.artifact-path }}
