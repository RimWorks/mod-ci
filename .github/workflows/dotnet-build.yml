name: dotnet build

# Build, test, publish the results and check formatting. Every mod repo had its own near
# identical copy of this job, which is the drift this package exists to stop.

on:
  workflow_call:
    inputs:
      solution:
        description: Solution or project to build, for example Quickstarts.slnx
        type: string
        required: true
      dotnet-version:
        description: Passed to setup-dotnet. Newline separated for more than one SDK.
        type: string
        default: '10.0.x'
      test:
        description: Run the test suite. Turn it off for a repo with no test project.
        type: boolean
        default: true
      test-solution:
        description: Project to test, when it is not the one that was built.
        type: string
        default: ''
      format:
        description: Run dotnet format --verify-no-changes.
        type: boolean
        default: true
      results-name:
        description: Check-run name the test results are published under.
        type: string
        default: unit tests
      artifact-name:
        description: Upload the build output under this name. Empty uploads nothing.
        type: string
        default: ''
      artifact-paths:
        description: Newline separated paths to upload when artifact-name is set.
        type: string
        default: ''
      game-images:
        description: >
          JSON object of game version to image ref, as game-image.yml returns, for example
          {"1.5":"ghcr.io/o/rimworld-game:a"}. Each leg compiles against its own image, which is
          what keeps a version and its assemblies from drifting apart. Required: there is no
          reference-package fallback.
        type: string
        required: true

      game-managed-property:
        description: MSBuild property that receives the staged Managed directory.
        type: string
        default: GameManagedDir

permissions:
  contents: read

jobs:
  # python, not jq: jq's capture() yields empty on a non-match and map() then drops the element,
  # which is the silent skip this job exists to prevent
  prepare:
    runs-on: ubuntu-latest
    outputs:
      legs: ${{ steps.list.outputs.legs }}
    steps:
      - id: list
        env:
          GAME_IMAGES: ${{ inputs.game-images }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, re, sys

          try:
              refs = json.loads(os.environ["GAME_IMAGES"])
          except json.JSONDecodeError as err:
              print(f"::error::game-images is not JSON: {err}", file=sys.stderr)
              sys.exit(1)

          if not isinstance(refs, dict) or not refs:
              print("::error::game-images is empty, so there is no version to build", file=sys.stderr)
              sys.exit(1)

          legs = []
          for version, image in sorted(refs.items()):
              if re.fullmatch(r"\d+\.\d+", version) is None or not str(image).strip():
                  print(f'::error::game-images has a bad entry: {version!r}: {image!r}', file=sys.stderr)
                  sys.exit(1)
              legs.append({"version": version, "image": image})

          print(f"legs={json.dumps({'include': legs})}")
          PY

  build:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.legs) }}
    permissions:
      contents: read
      checks: write
      packages: read
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      # The real game assemblies are the only reference set. A mod that patches sealed or
      # private members cannot compile against a reference package at all.
      - name: Stage game assemblies
        id: refs
        uses: RimWorks/mod-ci/.github/actions/stage-game-refs@v1
        with:
          image: ${{ matrix.image }}

      # dotnet test and dotnet format also resolve references, and format takes no -p:,
      # so both properties go in the environment where msbuild reads them anyway
      - name: Point msbuild at this leg's version and refs
        env:
          MANAGED_PROPERTY: ${{ inputs.game-managed-property }}
          MANAGED_DIR: ${{ steps.refs.outputs.managed-dir }}
        run: |
          echo "GameVersion=${{ matrix.version }}" >> "$GITHUB_ENV"
          echo "$MANAGED_PROPERTY=$MANAGED_DIR" >> "$GITHUB_ENV"

      - name: Build against the real game assemblies
        run: >
          dotnet build ${{ inputs.solution }} -c Release --nologo
          -p:GameVersion=${{ matrix.version }}
          "-p:${{ inputs.game-managed-property }}=${{ steps.refs.outputs.managed-dir }}"

      - name: Upload build output
        if: inputs.artifact-name != ''
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact-name }} ${{ matrix.version }}
          if-no-files-found: error
          path: ${{ inputs.artifact-paths }}

      - name: Run tests
        if: inputs.test
        run: >
          dotnet test ${{ inputs.test-solution != '' && inputs.test-solution || inputs.solution }}
          -c Release --nologo
          --logger "trx;LogFileName=tests.trx" --results-directory "$RUNNER_TEMP/test-results"

      - name: Publish the test results
        if: always() && inputs.test
        uses: dorny/test-reporter@v3
        with:
          name: ${{ inputs.results-name }} ${{ matrix.version }}
          path: ${{ runner.temp }}/test-results/*.trx
          reporter: dotnet-trx
          fail-on-error: false

      - name: dotnet format
        if: inputs.format
        run: dotnet format ${{ inputs.solution }} --verify-no-changes
