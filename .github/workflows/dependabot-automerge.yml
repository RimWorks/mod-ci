name: dependabot-automerge

on:
  workflow_call:
    inputs:
      merge-method:
        description: squash, merge or rebase
        type: string
        default: squash

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Read the update metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      # majors stay open for a human: MSTest 3 to 4 and TypeScript 5 to 7 both broke the build
      - name: Enable auto-merge for patch and minor
        if: steps.meta.outputs.update-type == 'version-update:semver-patch'
          || steps.meta.outputs.update-type == 'version-update:semver-minor'
        run: gh pr merge --auto --"$METHOD" "$PR_URL"
        env:
          METHOD: ${{ inputs.merge-method }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
