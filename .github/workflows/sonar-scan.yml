name: sonar scan

on:
  workflow_call:
    inputs:
      project-key:
        description: SonarCloud project key, for example RimWorks_mod-ci.
        type: string
        required: true
      organization:
        description: SonarCloud organization key. Lowercase.
        type: string
        default: rimworks
      exclusions:
        description: Comma separated sonar.exclusions globs.
        type: string
        default: ''
      coverage-report:
        description: Path to an lcov report. Empty skips coverage.
        type: string
        default: ''
      extra-args:
        description: Extra -D arguments passed to the scanner.
        type: string
        default: ''
    secrets:
      SONAR_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  scan:
    name: scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || '' }}
          allow-unsafe-pr-checkout: ${{ github.event_name == 'pull_request_target' }}

      - uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >-
            -Dsonar.projectKey=${{ inputs.project-key }}
            -Dsonar.organization=${{ inputs.organization }}
            ${{ inputs.exclusions != '' && format('-Dsonar.exclusions={0}', inputs.exclusions) || '' }}
            ${{ inputs.coverage-report != '' && format('-Dsonar.javascript.lcov.reportPaths={0}', inputs.coverage-report) || '' }}
            ${{ github.event_name == 'pull_request_target' && format('-Dsonar.pullrequest.key={0} -Dsonar.pullrequest.branch={1} -Dsonar.pullrequest.base={2}', github.event.pull_request.number, github.event.pull_request.head.ref, github.event.pull_request.base.ref) || '' }}
            ${{ inputs.extra-args }}
