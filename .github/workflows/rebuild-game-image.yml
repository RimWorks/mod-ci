name: rebuild game image

on:
  workflow_dispatch:
    inputs:
      branches:
        description: Newline "<game version>=<steam branch>" pairs to rebuild.
        type: string
        default: |
          1.5=version-1.5
          1.6=public
      windows:
        description: Also build the Windows images.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  image:
    name: rimworld images
    uses: ./.github/workflows/game-image.yml
    permissions:
      contents: read
      packages: write
    with:
      artifact-prefix: rebuild-image-ref
      image: ghcr.io/${{ github.repository_owner }}/rimworld-game
      branches: ${{ inputs.branches }}
      windows: ${{ inputs.windows }}
      force: true
    secrets: inherit
