name: sonar

on:
  workflow_call:
    inputs:
      solution:
        description: Solution or project to build and test
        type: string
        required: true
      project-key:
        description: SonarCloud project key
        type: string
        required: true
      organization:
        description: SonarCloud organization
        type: string
        default: rimworks
      runner:
        description: Runner label, windows-latest for repos that need it
        type: string
        default: ubuntu-latest
      dotnet-version:
        description: SDK to install
        type: string
        default: 10.0.x
      configuration:
        description: Build configuration
        type: string
        default: Release
      exclusions:
        description: Value for sonar.exclusions
        type: string
        default: ''
      coverage-exclusions:
        description: Value for sonar.coverage.exclusions
        type: string
        default: ''
      extra-begin-args:
        description: "Extra /d: args appended to scanner begin, for example a javascript lcov path"
        type: string
        default: ''
      analyzer-severity:
        description: Severity for the analyzer gate, or 'none' to skip it
        type: string
        default: info
      test-filter:
        description: dotnet test --filter, to keep timing-sensitive tests out of an instrumented run
        type: string
        default: ''
      pre-scan-command:
        description: Bash command run before the scan, for a frontend build that produces lcov
        type: string
        default: ''
      node-version:
        description: Node to install before the pre-scan, empty to skip node entirely
        type: string
        default: ''
      package-manager:
        description: "'pnpm' installs pnpm and caches its store, empty means npm with no cache"
        type: string
        default: ''
      cache-dependency-path:
        description: Lockfile the node cache keys on
        type: string
        default: ''
    secrets:
      # matches the repo secret name. secret names cannot contain a hyphen.
      SONAR_TOKEN:
        required: true

permissions:
  contents: read

# no concurrency here: github.ref is the caller's, so two callers on one ref would cancel each other

jobs:
  analyze:
    # dependabot PRs get no repository secrets, so SONAR_TOKEN is empty and the scan cannot authenticate.
    if: github.actor != 'dependabot[bot]'
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Sonar needs full history to blame lines and scope new code.
          fetch-depth: 0

      - name: Setup pnpm
        if: inputs.package-manager == 'pnpm'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      # setup-node reads the pnpm store path, so pnpm has to exist before this runs.
      - name: Setup Node
        if: inputs.node-version != ''
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ inputs.package-manager }}
          cache-dependency-path: ${{ inputs.cache-dependency-path }}

      - name: Pre-scan
        if: inputs.pre-scan-command != ''
        shell: bash
        run: ${{ inputs.pre-scan-command }}

      # sha rather than ./ because a called workflow only has the caller's repo checked out
      - uses: RimWorks/mod-ci/.github/actions/dotnet-sonar@eae5a8f32bee86128ae88bf8821ebaca65ddc1e9 # v1.4.1
        with:
          solution: ${{ inputs.solution }}
          project-key: ${{ inputs.project-key }}
          sonar-token: ${{ secrets.SONAR_TOKEN }}
          organization: ${{ inputs.organization }}
          dotnet-version: ${{ inputs.dotnet-version }}
          configuration: ${{ inputs.configuration }}
          exclusions: ${{ inputs.exclusions }}
          coverage-exclusions: ${{ inputs.coverage-exclusions }}
          extra-begin-args: ${{ inputs.extra-begin-args }}
          analyzer-severity: ${{ inputs.analyzer-severity }}
          test-filter: ${{ inputs.test-filter }}
