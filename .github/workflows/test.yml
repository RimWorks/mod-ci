name: test

on:
  pull_request:
  workflow_call:

# a called workflow inherits the caller's scopes unless it declares its own.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm test

      # the checker has to work against a real consumer, not just its own fixtures
      - name: Check this repo has no cp step to verify
        run: node bin/verify-ship-list.mjs .
