name: test

on:
  pull_request:
  workflow_call:

# a called workflow inherits the caller's scopes unless it declares its own.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm test

      # three release pipelines gate on this CLI, so its exit path runs here too. mod-ci is not
      # a mod and has no loadFolders.xml, so the check gets a throwaway one
      - name: Check the ship-list CLI against a throwaway mod
        run: |
          mod="$RUNNER_TEMP/mod"
          mkdir -p "$mod/1.6"
          printf '<loadFolders><v1.6><li>1.6</li></v1.6></loadFolders>\n' > "$mod/loadFolders.xml"
          node bin/verify-ship-list.mjs "$mod"
