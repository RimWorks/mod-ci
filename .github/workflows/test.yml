name: test

on:
  pull_request:
  workflow_call:

# release.yml grants write scopes; a called workflow inherits them unless it drops them.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: npm test

      # the checker has to work against a real consumer, not just its own fixtures
      - name: Check this repo has no cp step to verify
        run: node bin/verify-ship-list.mjs .
