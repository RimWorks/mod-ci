name: test

on:
  pull_request:
  workflow_call:

# a called workflow inherits the caller's scopes unless it declares its own.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - run: npm test

      # the checker has to work against a real consumer, not just its own fixtures
      - name: Check this repo has no cp step to verify
        run: node bin/verify-ship-list.mjs .
