name: package deps

# A reference package that reaches the nuspec gives every consumer a second copy of each game
# type. Packing on a dev box passes for the wrong reason; a runner has no game, so it forces it.

on:
  workflow_call:
    inputs:
      project:
        description: Project to pack, for example Source/Pickle.Ref/Pickle.Ref.csproj
        type: string
        required: true
      dotnet-version:
        description: Passed to setup-dotnet.
        type: string
        default: '10.0.x'
      reference-packages:
        description: >
          Newline list of package ids that must never reach a consumer. Required: a caller names
          its own, because the right list differs per project.
        type: string
        required: true
      game-image:
        description: >
          Game image to compile against, as produced by game-image.yml. Required: the packed
          project references the mod project, and there is no reference-package fallback.
        type: string
        required: true
      game-version:
        description: Version the pack compiles as. Picks the RW_* constant.
        type: string
        default: '1.6'

permissions:
  contents: read
  packages: read

jobs:
  check:
    name: package deps
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      - name: Stage game assemblies
        id: refs
        uses: RimWorks/mod-ci/.github/actions/stage-game-refs@v1
        with:
          image: ${{ inputs.game-image }}

      - name: Pack and read the nuspec
        env:
          PROJECT: ${{ inputs.project }}
          BANNED: ${{ inputs.reference-packages }}
          # msbuild reads an environment variable as a property, and pack is the only step here
          GameVersion: ${{ inputs.game-version }}
          GameManagedDir: ${{ steps.refs.outputs.managed-dir }}
        run: |
          out="$RUNNER_TEMP/pack"
          dotnet pack "$PROJECT" -c Release -o "$out"

          pkg="$(find "$out" -name '*.nupkg' -print -quit)"
          [[ -n "$pkg" ]] || { echo "::error::$PROJECT produced no nupkg"; exit 1; }
          echo "packed $(basename "$pkg")"

          python3 - <<'PY'
          import os, re, sys, zipfile

          banned = {p.strip().lower() for p in os.environ["BANNED"].splitlines() if p.strip()}
          if not banned:
              print("::error::reference-packages is empty, so this check would pass without testing anything")
              sys.exit(1)

          out = os.environ["RUNNER_TEMP"] + "/pack"
          pkg = next(f for f in os.listdir(out) if f.endswith(".nupkg"))

          with zipfile.ZipFile(os.path.join(out, pkg)) as z:
              name = next(n for n in z.namelist() if n.endswith(".nuspec"))
              nuspec = z.read(name).decode("utf-8")

          bad = [
              line.strip()
              for line in nuspec.splitlines()
              if "<dependency " in line
              and (m := re.search(r'id="([^"]+)"', line))
              and m.group(1).lower() in banned
          ]

          if not bad:
              print(f"{pkg}: no reference-assembly dependencies")
              sys.exit(0)

          for line in bad:
              print(f"::error::{pkg} ships a reference-assembly dependency: {line}")
          print(
              "A consumer restoring this package also restores that one, so every game type is "
              "defined twice and their build fails with CS0433. An exclude= attribute on the line "
              "does not prevent it. Add PrivateAssets=\"all\" to the PackageReference instead."
          )
          sys.exit(1)
          PY
