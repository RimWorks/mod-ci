name: codeql

on:
  workflow_call:
    inputs:
      languages:
        description: JSON array of CodeQL languages to scan
        type: string
        default: '["actions"]'
      build-mode:
        description: CodeQL build mode. csharp scans buildless on none.
        type: string
        default: none

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(inputs.languages) }}
    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ inputs.build-mode }}
          # These repos pin actions to a major tag on purpose, so the SHA query would fire
          # on every workflow in every consumer.
          config: |
            query-filters:
              - exclude:
                  id: actions/unpinned-tag

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
