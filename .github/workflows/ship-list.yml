name: ship-list

on:
  workflow_call:
    inputs:
      ref:
        description: mod-ci commit sha to run the checker from
        type: string
        default: d6261858b6b74c0cd3ca03c6402c954d58ac7fee # v1.5.1

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: RimWorks/mod-ci
          ref: ${{ inputs.ref }}
          path: .mod-ci
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Verify the release zip ships every mod content directory
        run: node .mod-ci/bin/verify-ship-list.mjs .
