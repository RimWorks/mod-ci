name: ship-list

on:
  workflow_call:
    inputs:
      ref:
        description: mod-ci tag to run the checker from
        type: string
        default: v1.10

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: RimWorks/mod-ci
          ref: ${{ inputs.ref }}
          path: .mod-ci
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Verify the release zip ships every mod content directory
        run: node .mod-ci/bin/verify-ship-list.mjs .
