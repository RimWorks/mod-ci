name: game image

# Builds a game image from Steam and hands its ref to the caller. Pickle and Quickstarts
# each carried a verbatim copy of this before it moved here.

on:
  workflow_call:
    inputs:
      branches:
        description: >
          Newline separated "<key>=<steam branch>" pairs, one per image to build. The key is a game
          version or a plain name, so a line reads "1.6=version-1.6.4871" or "elin=public". Each
          leg is its own image, and the caller gets a JSON map keyed by it rather than one ref it
          has to guess a key for.
        type: string
        required: true
      game:
        description: Game to build. The action installs the matching @gamecrate plugin.
        type: string
        default: rimworld
      variant:
        description: >
          Image variant to build. gamecrate tags every variant "<key>-<variant>", and gives the
          bare key only to the plugin's default variant.
        type: string
        default: linux
      image:
        description: >
          Repository to push to. Required and named by the caller, so no repo publishes an
          image it never asked for.
        type: string
        required: true
      artifact-prefix:
        description: >
          Names the per-leg ref artifacts. Required, and it has to differ per caller: two calls
          in one run that share a prefix collide, and the map comes back empty.
        type: string
        required: true
      force:
        description: Rebuild even when the Steam buildid has not moved.
        type: boolean
        default: false
      windows:
        description: Also build a Windows image, published as the linux name plus -windows.
        type: boolean
        default: false
      windows-base-image:
        description: Base image for the Windows build. Proton runs the game under Linux.
        type: string
        default: ghcr.io/rimworks/steam-game-image-action/runtime-base-proton:latest
    secrets:
      STEAM_USERNAME:
        required: false
      STEAM_CONFIG_VDF_B64:
        required: false
      DEPOTDOWNLOADER_ACCOUNT_B64:
        required: false
    outputs:
      image-refs:
        description: >
          JSON object of branches key to image ref for the chosen variant, for example
          {"1.5":"ghcr.io/o/g:a"}. Feed it straight to dotnet-build.yml's game-images.
        value: ${{ jobs.collect.outputs.image-refs }}
      windows-image-refs:
        description: The same map for the Windows images, empty unless windows was set.
        value: ${{ jobs.collect.outputs.windows-image-refs }}

permissions:
  contents: read

jobs:
  prepare:
    name: legs
    runs-on: ubuntu-26.04
    outputs:
      legs: ${{ steps.parse.outputs.legs }}
    steps:
      - name: Parse the branches list
        id: parse
        env:
          BRANCHES: ${{ inputs.branches }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, re, sys

          legs, seen = [], set()
          for raw in os.environ["BRANCHES"].splitlines():
              line = raw.strip()
              if not line:
                  continue
              hit = re.fullmatch(r"(\d+\.\d+|[A-Za-z][A-Za-z0-9._-]*)=(\S+)", line)
              if hit is None:
                  print(f'::error::branches line is not "<version>=<steam branch>" or "<name>=<steam branch>": {line}', file=sys.stderr)
                  sys.exit(1)
              version, branch = hit.groups()
              if version in seen:
                  print(f"::error::branches names {version} twice", file=sys.stderr)
                  sys.exit(1)
              seen.add(version)
              legs.append({"version": version, "branch": branch})

          if not legs:
              print("::error::branches is empty, so there is no image to build", file=sys.stderr)
              sys.exit(1)
          print(f"legs={json.dumps({'include': legs})}")
          PY

  image:
    name: ${{ inputs.game }} image ${{ matrix.version }}
    needs: prepare
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.legs) }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Build the ${{ inputs.game }} game image
        id: image
        uses: RimWorks/steam-game-image-action@v4
        with:
          steam-username: ${{ secrets.STEAM_USERNAME }}
          steam-config-vdf: ${{ secrets.STEAM_CONFIG_VDF_B64 }}
          depotdownloader-account: ${{ secrets.DEPOTDOWNLOADER_ACCOUNT_B64 }}
          game: ${{ inputs.game }}
          branch: ${{ matrix.branch }}
          variant: ${{ inputs.variant }}
          aliases: ${{ matrix.version }}
          image: ${{ inputs.image }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          skip-if-unchanged: ${{ inputs.force && 'false' || 'true' }}


      - name: Record the ref for the collect job
        run: |
          printf '{"kind":"image","version":"%s","ref":"%s"}' \
            '${{ matrix.version }}' '${{ steps.image.outputs.image-ref }}' > "$RUNNER_TEMP/ref.json"

      - name: Publish this leg's ref
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact-prefix }}-image-${{ matrix.version }}
          path: ${{ runner.temp }}/ref.json
          if-no-files-found: error

      - name: Report what was built
        run: |
          {
            echo "## ${{ inputs.game }} game image ${{ matrix.version }}"
            echo
            echo "| field | value |"
            echo "| --- | --- |"
            echo "| ref | \`${{ steps.image.outputs.image-ref }}\` |"
            echo "| steam buildid | ${{ steps.image.outputs.buildid }} |"
            echo "| rebuilt | ${{ steps.image.outputs.skipped == 'true' && 'no, buildid unchanged' || 'yes' }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  image-windows:
    name: ${{ inputs.game }} windows image ${{ matrix.version }}
    needs: prepare
    if: inputs.windows
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.legs) }}
    # a windows leg is a bonus platform, so losing it does not fail the caller's run
    continue-on-error: true
    permissions:
      contents: read
      packages: write
    steps:
      - name: Build the ${{ inputs.game }} Windows game image
        id: image
        uses: RimWorks/steam-game-image-action@v4
        with:
          steam-username: ${{ secrets.STEAM_USERNAME }}
          steam-config-vdf: ${{ secrets.STEAM_CONFIG_VDF_B64 }}
          depotdownloader-account: ${{ secrets.DEPOTDOWNLOADER_ACCOUNT_B64 }}
          game: ${{ inputs.game }}
          branch: ${{ matrix.branch }}
          variant: windows
          aliases: ${{ matrix.version }}
          base-image: ${{ inputs.windows-base-image }}
          image: ${{ format('{0}-windows', inputs.image) }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          skip-if-unchanged: ${{ inputs.force && 'false' || 'true' }}


      - name: Record the ref for the collect job
        run: |
          printf '{"kind":"windows","version":"%s","ref":"%s"}' \
            '${{ matrix.version }}' '${{ steps.image.outputs.image-ref }}' > "$RUNNER_TEMP/ref.json"

      - name: Publish this leg's ref
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact-prefix }}-windows-${{ matrix.version }}
          path: ${{ runner.temp }}/ref.json
          if-no-files-found: error

      - name: Report what was built
        run: |
          {
            echo "## ${{ inputs.game }} Windows game image ${{ matrix.version }}"
            echo
            echo "| field | value |"
            echo "| --- | --- |"
            echo "| ref | \`${{ steps.image.outputs.image-ref }}\` |"
            echo "| steam buildid | ${{ steps.image.outputs.buildid }} |"
            echo "| rebuilt | ${{ steps.image.outputs.skipped == 'true' && 'no, buildid unchanged' || 'yes' }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  collect:
    name: image refs
    needs: [prepare, image, image-windows]
    if: always() && needs.image.result == 'success'
    runs-on: ubuntu-26.04
    outputs:
      image-refs: ${{ steps.merge.outputs.image-refs }}
      windows-image-refs: ${{ steps.merge.outputs.windows-image-refs }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: ${{ inputs.artifact-prefix }}-*
          path: refs

      - name: Merge the legs into one map
        id: merge
        env:
          PREFIX: ${{ inputs.artifact-prefix }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, pathlib, sys

          maps = {"image": {}, "windows": {}}
          for f in sorted(pathlib.Path("refs").rglob("*.json")):
              leg = json.loads(f.read_text())
              maps[leg["kind"]][leg["version"]] = leg["ref"]

          if not maps["image"]:
              print(f"::error::no image refs under prefix {os.environ['PREFIX']}. Another caller "
                    "in this run may share it, which makes the artifacts collide", file=sys.stderr)
              sys.exit(1)
          print(f"image-refs={json.dumps(maps['image'], sort_keys=True)}")
          print(f"windows-image-refs={json.dumps(maps['windows'], sort_keys=True)}")
          PY
