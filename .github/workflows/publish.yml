name: publish

on:
  workflow_call:
    inputs:
      workdir:
        description: Directory of the mod inside the checkout. It holds package.json and release-config.
        type: string
        default: '.'
      version:
        description: Version semantic-release just tagged, without a leading v.
        type: string
        required: true
      branch:
        description: Branch the release was cut from, for the Steam branch target.
        type: string
        default: ${{ github.ref_name }}
      node-version:
        description: Node major version to run the publish tooling with.
        type: string
        default: '22'
      zip-artifact:
        description: Artifact holding the release zips. Empty skips the Steam push.
        type: string
        default: ''
      zip-artifact-pattern:
        description: Glob matching several zip artifacts, for a repo that uploads one per mod.
        type: string
        default: ''
      release-config:
        description: semantic-release config the Steam plugin options are read from.
        type: string
        default: release.config.mjs
      discord-mod-name:
        description: Display name to announce. Empty skips the Discord announcement.
        type: string
        default: ''
      discord-workshop-id:
        description: Workshop id, or `Label=id` pairs when one release ships several mods.
        type: string
        default: ''
      discord-embed-color:
        description: Embed colour as hex without the leading hash.
        type: string
        default: '5865F2'
      discord-attachment:
        description: Glob matching one zip in the release artifact to attach to the announcement.
        type: string
        default: ''
      previous-tag:
        description: Newest tag before the release job ran, so an unmoved tag announces nothing.
        type: string
        default: ''
      tag:
        description: Tag the release job cut. Empty makes the Discord job read it back out of git.
        type: string
        default: ''
    secrets:
      STEAM_USERNAME:
        description: Steam account the Workshop upload logs in as. Required unless both zip inputs are empty.
        required: false
      STEAM_PASSWORD:
        description: Password for that account, for the SteamCMD login the cached vdf cannot complete.
        required: false
      STEAM_CONFIG_VDF_B64:
        description: Base64 of SteamCMD's config.vdf, holding the saved login.
        required: false
      DISCORD_WEBHOOK_URL:
        description: Webhook the release announcement posts to. Required unless discord-mod-name is empty.
        required: false

permissions:
  contents: read

jobs:
  steam:
    name: steam
    if: inputs.zip-artifact != '' || inputs.zip-artifact-pattern != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.workdir }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: ${{ inputs.workdir }}/package-lock.json

      - name: Install publish dependencies
        run: npm ci --ignore-scripts

      - uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.zip-artifact }}
          pattern: ${{ inputs.zip-artifact-pattern }}
          merge-multiple: true
          path: ${{ runner.temp }}/zips

      - name: Unpack the release zips
        id: stage
        run: |
          stage="${{ runner.temp }}/stage"
          mkdir -p "$stage"
          find "${{ runner.temp }}/zips" -name '*.zip' -exec unzip -q -o {} -d "$stage" \;
          echo "dir=$stage" >> "$GITHUB_OUTPUT"
          ls -1 "$stage"

      - uses: RimWorks/mod-ci/.github/actions/steam-login@v4
        with:
          steam-config-vdf-b64: ${{ secrets.STEAM_CONFIG_VDF_B64 }}
          steam-username: ${{ secrets.STEAM_USERNAME }}

      - name: Read the release notes for the Workshop change note
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag != '' && inputs.tag || format('v{0}', inputs.version) }}
        run: |
          notes="$(gh release view "$TAG" --json body --jq .body 2>/dev/null || true)"
          if [ -z "$notes" ]; then
            echo "No GitHub release notes on $TAG, so the change note is the version alone."
          fi
          {
            echo "RELEASE_NOTES<<__RELEASE_NOTES__"
            printf '%s\n' "$notes"
            echo "__RELEASE_NOTES__"
          } >> "$GITHUB_ENV"

      - name: Publish to the Workshop
        working-directory: .
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_BRANCH: ${{ inputs.branch }}
          RELEASE_STAGE_DIR: ${{ steps.stage.outputs.dir }}
          STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}
          STEAM_PASSWORD: ${{ secrets.STEAM_PASSWORD }}
        run: >-
          "${{ inputs.workdir }}/node_modules/.bin/publish-steam"
          --root "${{ inputs.workdir }}" "${{ inputs.release-config }}"

  discord:
    name: discord
    needs: [steam]
    if: always() && !failure() && !cancelled() && inputs.discord-mod-name != ''
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        if: inputs.discord-attachment != ''
        with:
          name: ${{ inputs.zip-artifact }}
          pattern: ${{ inputs.zip-artifact-pattern }}
          merge-multiple: true
          path: ${{ runner.temp }}/announce

      - name: Find the zip to attach
        id: attachment
        if: inputs.discord-attachment != ''
        env:
          GLOB: ${{ inputs.discord-attachment }}
        run: |
          path="$(find "${{ runner.temp }}/announce" -name "$GLOB" | sort | head -1)"
          echo "path=$path" >> "$GITHUB_OUTPUT"

      - uses: RimWorks/mod-ci/.github/actions/discord-release@v4
        with:
          attachment: ${{ steps.attachment.outputs.path }}
          webhook-url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          mod-name: ${{ inputs.discord-mod-name }}
          role-ids: ${{ vars.DISCORD_ROLE_IDS }}
          workshop-id: ${{ inputs.discord-workshop-id }}
          embed-color: ${{ inputs.discord-embed-color }}
          previous-tag: ${{ inputs.previous-tag }}
          release-tag: ${{ inputs.tag }}
