name: sonar-self

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  scan:
    uses: ./.github/workflows/sonar-scan.yml
    with:
      project-key: RimWorks_mod-ci
      exclusions: tests/fixtures/**
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
